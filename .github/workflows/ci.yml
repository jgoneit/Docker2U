name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: React and IPC tests
        run: pnpm test
      - name: Isolated native fixture tests
        run: pnpm test:native-fixture
      - name: TypeScript and frontend build
        run: pnpm build
      - name: Install Chromium for synthetic browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser layout and interaction tests
        run: pnpm test:browser
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

  macos:
    name: macOS ARM64 build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Verify native prerequisites and pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          /usr/bin/python3 --version
          xcodebuild -version
          rustup show active-toolchain
          rustc --version
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-macos15-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare frontend for embedded Tauri context
        run: pnpm build
      - name: Rust formatting
        run: pnpm rust:fmt
      - name: Rust unit and fake CLI tests
        # Real Colima tests are ignored and require an explicitly prepared local Engine.
        run: pnpm rust:test
      - name: Build unsigned macOS app with locked Cargo dependencies
        run: pnpm native:build --ci --no-sign -- --locked
      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - name: Verify ARM64 binary and archive app
        run: |
          lipo src-tauri/target/release/bundle/macos/Docker2U.app/Contents/MacOS/docker2u -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Docker2U.app "$RUNNER_TEMP/Docker2U-macos-arm64-unsigned.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 Docker2U-macos-arm64-unsigned.zip > Docker2U-macos-arm64-unsigned.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Docker2U-macos-arm64-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Docker2U-macos-arm64-unsigned.zip
            ${{ runner.temp }}/Docker2U-macos-arm64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7
